<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Coral / Orange Right Wing Gradient -->
    <linearGradient id="nexoCoralGrad" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFA492" />
      <stop offset="40%" stop-color="#F2685F" />
      <stop offset="100%" stop-color="#E04D43" />
    </linearGradient>

    <!-- Mint / Teal Curved Ribbon Gradient -->
    <linearGradient id="nexoTealGrad" x1="15%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#80E9D5" />
      <stop offset="35%" stop-color="#4CC9A7" />
      <stop offset="70%" stop-color="#2D9A7A" />
      <stop offset="100%" stop-color="#1B6D56" />
    </linearGradient>

    <!-- Shadow under diagonal fold -->
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#111615" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. Right Coral Wing (Forms right leg of the N, tucked behind diagonal) -->
  <path
    d="M58 35.5L75.5 24.5C77 23.5 79 24.6 79 26.5V59C79 60.5 78 61.8 76.5 61.2L58 51.5V35.5Z"
    fill="url(#nexoCoralGrad)"
  />

  <!-- 2. Ambient Shadow of the fold -->
  <path
    d="M58 38L70 48.5C65.5 53.5 59.5 56 58 56V38Z"
    fill="#164E43"
    opacity="0.28"
  />

  <!-- 3. Mint-Teal Curved Left Leg & Diagonal Fold (Main Ribbon) -->
  <path
    d="M22 71.5V43C22 33.5 29.5 27.5 38.5 28.5C43.5 29 48 32 51.5 36.5L73.5 65.5C76 69 75 73.8 71.2 76.2C67.5 78.5 62.8 77.5 60 74L38 45.5C37 44 35.2 43 33.5 43.5C31.2 44 29.5 46 29.5 48.5V71.5C29.5 73.8 27.8 75.5 25.7 75.5C23.6 75.5 22 73.8 22 71.5Z"
    fill="url(#nexoTealGrad)"
    filter="url(#foldShadow)"
  />
</svg>
